# 錄影相關服務的 drop-in：USB（/mnt/usb）沒掛載就不啟動，避免寫進系統碟（SD 卡）
#
# fstab 的 /mnt/usb 設有 nofail：USB 掛不上時系統照常開機，但 /mnt/usb 只是 SD 上的空目錄，
# recorder.py 會自行 mkdir 並把錄影寫進 SD，直到塞滿系統碟。
# RequiresMountsFor 讓服務依賴 mnt-usb.mount：開機時 USB 沒掛上 → 服務不啟動。
# BindsTo 讓 USB 掛載不論因何消失（拔除、被卸載）→ 服務立即跟著停止。
#
# 第二道保險（不在此檔）：SD 卡上被 USB 蓋住的 /mnt/usb 目錄設為 chattr +i，
# USB 沒掛時任何程式都寫不進去：
#   sudo mkdir /tmp/sdroot && sudo mount --bind / /tmp/sdroot
#   sudo chattr +i /tmp/sdroot/mnt/usb && sudo umount /tmp/sdroot
#
# 安裝（每個服務一份）：
#   /etc/systemd/system/<服務>.service.d/require-usb.conf
#   適用：mumucam-recorder、mumucam-recorder-cam2、mumucam-playback、
#         mumucam-cleanup、mumucam-cleanup-sub
#
# USB 重新插上後：sudo mount /mnt/usb && sudo systemctl start mumucam-recorder mumucam-recorder-cam2 mumucam-playback
[Unit]
RequiresMountsFor=/mnt/usb
BindsTo=mnt-usb.mount
After=mnt-usb.mount
