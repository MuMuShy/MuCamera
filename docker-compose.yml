version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mumu-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mumucam}
      POSTGRES_USER: ${POSTGRES_USER:-mumucam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mumucam123}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mumucam}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mumu-network

  redis:
    image: redis:7-alpine
    container_name: mumu-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-mumucam_redis_secret}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-mumucam_redis_secret}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mumu-network

  coturn:
    image: coturn/coturn:latest
    container_name: mumu-coturn
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf
    command: -c /etc/coturn/turnserver.conf

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mumu-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mumucam}:${POSTGRES_PASSWORD:-mumucam123}@postgres:5432/${POSTGRES_DB:-mumucam}
      REDIS_URL: redis://:${REDIS_PASSWORD:-mumucam_redis_secret}@redis:6379/0
      TURN_HOST: ${TURN_HOST:-coturn}
      TURN_PUBLIC_HOST: ${TURN_PUBLIC_HOST:-localhost}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_SECRET: ${TURN_SECRET:-mumucam_turn_secret_key}
      JWT_SECRET: ${JWT_SECRET:-mumucam_jwt_secret_key_change_in_production}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost,http://localhost:8080}
      LIVEKIT_ENABLED: ${LIVEKIT_ENABLED:-false}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      LIVEKIT_RTMP_URL: ${LIVEKIT_RTMP_URL:-rtmp://livekit-ingress:1935/live}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      coturn:
        condition: service_started
    volumes:
      - ./backend:/app
    networks:
      - mumu-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: mumu-nginx
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend
    volumes:
      - ./web:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - mumu-network

  # Device Simulator (optional, use profile to enable)
  # Usage: docker-compose --profile sim up device-sim
  # Or: docker-compose --profile sim up -d
  device-sim:
    build:
      context: ./device-agent
      dockerfile: Dockerfile
    container_name: mumu-device-sim
    profiles:
      - sim
    environment:
      BACKEND_URL: ws://backend:8000/ws/device
      DEVICE_ID: ${DEVICE_ID:-simulator-001}
      VIDEO_SOURCE: ${VIDEO_SOURCE:-fake}
    depends_on:
      backend:
        condition: service_started
    networks:
      - mumu-network
    restart: unless-stopped
    command: python agent.py

  # Multiple device simulators can be started with:
  # docker-compose --profile sim up -d device-sim device-sim-2 device-sim-3
  device-sim-2:
    build:
      context: ./device-agent
      dockerfile: Dockerfile
    container_name: mumu-device-sim-2
    profiles:
      - sim
    environment:
      BACKEND_URL: ws://backend:8000/ws/device
      DEVICE_ID: simulator-002
      VIDEO_SOURCE: fake
    depends_on:
      backend:
        condition: service_started
    networks:
      - mumu-network
    restart: unless-stopped
    command: python agent.py

  device-sim-3:
    build:
      context: ./device-agent
      dockerfile: Dockerfile
    container_name: mumu-device-sim-3
    profiles:
      - sim
    environment:
      BACKEND_URL: ws://backend:8000/ws/device
      DEVICE_ID: simulator-003
      VIDEO_SOURCE: fake
    depends_on:
      backend:
        condition: service_started
    networks:
      - mumu-network
    restart: unless-stopped
    command: python agent.py

  # LiveKit SFU Server (optional, use profile to enable)
  # Usage: docker-compose --profile livekit up -d
  livekit:
    image: livekit/livekit-server:latest
    container_name: mumu-livekit
    profiles:
      - livekit
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret}"
      LIVEKIT_REDIS_ADDRESS: "redis:6379"
      LIVEKIT_REDIS_PASSWORD: "${REDIS_PASSWORD:-mumucam_redis_secret}"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - mumu-network
    restart: unless-stopped

  # LiveKit Ingress (RTMP → LiveKit)
  livekit-ingress:
    image: livekit/ingress:latest
    container_name: mumu-livekit-ingress
    profiles:
      - livekit
    ports:
      - "1935:1935"
    environment:
      INGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-devkey}
        api_secret: ${LIVEKIT_API_SECRET:-devsecret}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
          password: ${REDIS_PASSWORD:-mumucam_redis_secret}
        rtmp_port: 1935
        logging:
          level: info
    depends_on:
      - livekit
      - redis
    networks:
      - mumu-network
    restart: unless-stopped

networks:
  mumu-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
