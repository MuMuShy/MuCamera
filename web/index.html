<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水下直播系統 - iHousing 水下影音科技</title>
    <meta name="description" content="iHousing 水下影音科技 - 水下即時監控暨錄影回放系統">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="live-view.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <!-- LiveKit Client SDK (used only when LiveKit SFU mode is enabled) -->
    <script src="https://unpkg.com/livekit-client/dist/livekit-client.umd.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">
                    <i data-lucide="waves" style="width: 22px; height: 22px;"></i>
                </div>
                <h1>水下直播系統</h1>
            </div>

            <div class="user-profile">
                <div class="user-avatar">
                    <span id="username-initial">U</span>
                </div>
                <div class="user-details">
                    <div class="user-name" id="username">載入中...</div>
                    <div class="user-role">管理員</div>
                </div>
            </div>

            <nav class="nav-menu">
                <div class="nav-item active">
                    <span class="icon"><i data-lucide="layout-grid" style="width: 18px; height: 18px;"></i></span>
                    <span>裝置列表</span>
                </div>
                <a href="recordings.html" class="nav-item">
                    <span class="icon"><i data-lucide="film" style="width: 18px; height: 18px;"></i></span>
                    <span>錄影回放</span>
                </a>
                <a href="device-manage.html" class="nav-item">
                    <span class="icon"><i data-lucide="settings" style="width: 18px; height: 18px;"></i></span>
                    <span>系統設定</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button id="logoutBtn" class="nav-item" style="width: 100%; border: none; background: transparent;">
                    <span class="icon"><i data-lucide="log-out" style="width: 18px; height: 18px;"></i></span>
                    <span>登出</span>
                </button>
            </div>
            <footer class="app-footer">
                &copy; 2025 iHousing 水下影音科技 版權所有
                <span class="version">v1.0.0</span>
            </footer>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="page-title">
                    <button id="widthSidebarBtn" class="hamburger-btn" aria-label="開啟選單">
                        <i data-lucide="menu" style="width: 20px; height: 20px;"></i>
                    </button>
                    <h2>裝置列表</h2>
                </div>
                <div class="actions">
                    <button id="refreshBtn" class="btn btn-secondary">
                        <i data-lucide="refresh-cw" style="width: 16px; height: 16px;"></i>
                        重新整理
                    </button>
                    <button id="pairBtn" class="btn btn-primary">
                        <i data-lucide="plus" style="width: 16px; height: 16px;"></i>
                        配對新裝置
                    </button>
                </div>
            </header>

            <div class="content-area">
                <div id="devicesList" class="devices-grid">
                    <div class="loading-indicator">
                        <div class="spinner"></div>
                        <p>載入裝置中...</p>
                    </div>
                </div>
            </div>

            <!-- Live View Overlay (Hidden by default) -->
            <div id="watchSection" class="live-view-overlay">
                <header class="live-header">
                    <button id="endWatchBtn" class="back-btn">
                        <i data-lucide="arrow-left" style="width: 18px; height: 18px;"></i>
                        <span class="back-btn-text">裝置列表</span>
                    </button>
                    <div class="live-title">
                        <span id="watchingDeviceName" class="live-device-name">攝影機</span>
                        <span class="connection-status" id="connectionStatus">連線中...</span>
                    </div>
                    <div class="live-header-actions">
                        <span class="live-clock" id="liveClock">--:--:--</span>
                        <button id="toggleControlsBtn" class="toggle-controls-btn" aria-label="收合操作面板">
                            <i data-lucide="panel-right-close" style="width: 20px; height: 20px;"></i>
                        </button>
                    </div>
                </header>

                <div class="live-container">
                    <div class="video-stage" id="videoStage">
                        <video id="remoteVideo" autoplay playsinline muted></video>

                        <!-- 畫面資訊 -->
                        <div class="video-overlay-top">
                            <span class="stage-live-badge" id="liveBadge">LIVE</span>
                            <span class="video-chip" id="videoSourceLabel">攝影機 1 · 流暢 SD</span>
                        </div>

                        <!-- 連線狀態（連線中 / 錯誤） -->
                        <div class="video-state" id="videoState">
                            <div class="video-state-spinner" id="videoStateSpinner"></div>
                            <i data-lucide="video-off" class="video-state-icon" id="videoStateIcon"></i>
                            <div class="video-state-text" id="videoStateText">連線中...</div>
                            <button class="btn btn-secondary btn-sm video-retry-btn" id="videoRetryBtn" type="button">
                                <i data-lucide="rotate-cw" style="width: 14px; height: 14px;"></i>
                                重新連線
                            </button>
                        </div>

                        <!-- 畫面工具列 -->
                        <div class="video-toolbar">
                            <button class="video-tool-btn" id="snapshotBtn" type="button" title="截圖存檔" aria-label="截圖存檔">
                                <i data-lucide="camera" style="width: 18px; height: 18px;"></i>
                            </button>
                            <button class="video-tool-btn" id="fullscreenBtn" type="button" title="全螢幕" aria-label="全螢幕">
                                <i data-lucide="maximize" style="width: 18px; height: 18px;"></i>
                            </button>
                        </div>
                    </div>

                    <aside class="controls-sidebar">
                        <!-- 畫面來源 -->
                        <div class="control-group">
                            <h3 class="control-title">
                                <i data-lucide="video" class="control-title-icon"></i>
                                畫面來源
                            </h3>
                            <div class="segmented">
                                <button class="stream-switch-btn active" data-cam="cam" onclick="switchCamera('cam')">攝影機 1</button>
                                <button class="stream-switch-btn" data-cam="cam2" onclick="switchCamera('cam2')">攝影機 2</button>
                            </div>
                            <div class="segmented" style="margin-top: 8px;">
                                <button class="stream-switch-btn active" id="btnSD" onclick="toggleQuality('sd')">流暢 SD</button>
                                <button class="stream-switch-btn" id="btnHD" onclick="toggleQuality('hd')">高清 HD</button>
                            </div>
                        </div>

                        <!-- 水質監測（有接水質監測站的裝置才顯示） -->
                        <div class="control-group" id="wqSection" style="display: none;">
                            <h3 class="control-title control-title-row">
                                <span>
                                    <i data-lucide="droplets" class="control-title-icon"></i>
                                    水質監測
                                </span>
                                <span class="status-chip">
                                    <span class="gps-indicator" id="wqIndicator"></span>
                                    <span id="wqStatusText">讀取中...</span>
                                </span>
                            </h3>
                            <div id="wqRows"></div>
                        </div>

                        <!-- 鏡頭控制 -->
                        <div class="control-group">
                            <h3 class="control-title">
                                <i data-lucide="aperture" class="control-title-icon"></i>
                                鏡頭控制
                            </h3>
                            <div id="ptzControls">
                                <!-- Directional PTZ hidden as per user request -->
                                <div class="ptz-grid" style="display: none;">
                                    <button class="ptz-btn" data-action="move" data-pan="-0.5" data-tilt="0.5" disabled>↖</button>
                                    <button class="ptz-btn" data-action="move" data-pan="0" data-tilt="0.5" title="上">▲</button>
                                    <button class="ptz-btn" data-action="move" data-pan="0.5" data-tilt="0.5" disabled>↗</button>
                                    <button class="ptz-btn" data-action="move" data-pan="-0.5" data-tilt="0" title="左">◀</button>
                                    <button class="ptz-btn center ptz-home" data-action="stop" title="停止">停止</button>
                                    <button class="ptz-btn" data-action="move" data-pan="0.5" data-tilt="0" title="右">▶</button>
                                    <button class="ptz-btn" data-action="move" data-pan="-0.5" data-tilt="-0.5" disabled>↙</button>
                                    <button class="ptz-btn" data-action="move" data-pan="0" data-tilt="-0.5" title="下">▼</button>
                                    <button class="ptz-btn" data-action="move" data-pan="0.5" data-tilt="-0.5" disabled>↘</button>
                                </div>

                                <div class="lens-label">變焦（按住）</div>
                                <div class="zoom-controls">
                                    <button class="zoom-btn ptz-btn" data-action="move" data-zoom="-0.5">
                                        <i data-lucide="zoom-out" style="width: 16px; height: 16px;"></i>
                                        拉遠
                                    </button>
                                    <button class="zoom-btn ptz-btn" data-action="move" data-zoom="0.5">
                                        <i data-lucide="zoom-in" style="width: 16px; height: 16px;"></i>
                                        拉近
                                    </button>
                                </div>
                                <div class="lens-label">對焦</div>
                                <div class="zoom-controls">
                                    <button class="zoom-btn ptz-btn" data-action="focus" data-direction="near">近焦</button>
                                    <button class="zoom-btn ptz-btn" data-action="auto_focus">
                                        <i data-lucide="focus" style="width: 14px; height: 14px;"></i>
                                        自動
                                    </button>
                                    <button class="zoom-btn ptz-btn" data-action="focus" data-direction="far">遠焦</button>
                                </div>
                            </div>
                        </div>

                        <!-- GPS 定位資訊 -->
                        <div class="control-group" id="gpsSection">
                            <h3 class="control-title control-title-row">
                                <span>
                                    <i data-lucide="map-pin" class="control-title-icon"></i>
                                    GPS 定位
                                </span>
                                <span class="status-chip">
                                    <span class="gps-indicator" id="gpsIndicator"></span>
                                    <span id="gpsStatusText">未啟用</span>
                                </span>
                            </h3>
                            <div id="gpsInfo" class="gps-info">
                                <div class="gps-coords" id="gpsCoords" style="display: none;">
                                    <div class="gps-row">
                                        <span class="gps-label">緯度</span>
                                        <span class="gps-value" id="gpsLat">--</span>
                                    </div>
                                    <div class="gps-row">
                                        <span class="gps-label">經度</span>
                                        <span class="gps-value" id="gpsLon">--</span>
                                    </div>
                                    <div class="gps-row">
                                        <span class="gps-label">衛星數</span>
                                        <span class="gps-value" id="gpsSats">--</span>
                                    </div>
                                    <div class="gps-row" id="gpsSpeedRow" style="display: none;">
                                        <span class="gps-label">速度</span>
                                        <span class="gps-value" id="gpsSpeed">--</span>
                                    </div>
                                </div>
                                <div class="gps-actions" id="gpsActions" style="display: none;">
                                    <a id="gpsMapLink" href="#" target="_blank" rel="noopener" class="btn btn-secondary btn-sm">
                                        <i data-lucide="external-link" style="width: 14px; height: 14px;"></i>
                                        開啟地圖
                                    </a>
                                </div>
                            </div>
                        </div>
                    </aside>
                </div>
            </div>
        </main>

        <!-- Pairing Modal -->
        <div id="pairingModal" class="modal">
            <div class="modal-content">
                <button class="close-modal close" aria-label="關閉">
                    <i data-lucide="x" style="width: 18px; height: 18px;"></i>
                </button>
                <h2 class="modal-title">配對新裝置</h2>
                <p class="modal-desc">請輸入顯示在攝影機裝置上的 6 位數代碼。</p>

                <input type="text" id="pairingCodeInput" class="otp-input" maxlength="6" placeholder="000000"
                    autocomplete="off">

                <button id="submitPairingBtn" class="btn btn-primary btn-block">
                    <i data-lucide="link" style="width: 16px; height: 16px;"></i>
                    連線裝置
                </button>

                <p id="pairingError" style="color: var(--danger-color); margin-top: 16px; text-align: center; font-size: 0.9rem;"></p>
            </div>
        </div>

        <!-- Sidebar Overlay -->
        <div id="sidebarOverlay" class="sidebar-overlay"></div>
    </div>

    <script src="app.js?v=8"></script>
    <script src="webrtc.js?v=9"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>

</html>
