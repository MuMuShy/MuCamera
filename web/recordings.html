<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>錄影回放 - iHousing 水下直播系統</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <!-- HLS.js for video playback -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">
                    <i data-lucide="waves" style="width: 22px; height: 22px;"></i>
                </div>
                <h1>水下直播系統</h1>
            </div>

            <div class="user-profile">
                <div class="user-avatar">
                    <span id="username-initial">U</span>
                </div>
                <div class="user-details">
                    <div class="user-name" id="username">載入中...</div>
                    <div class="user-role">管理員</div>
                </div>
            </div>

            <nav class="nav-menu">
                <a href="index.html" class="nav-item">
                    <span class="icon"><i data-lucide="layout-grid" style="width: 18px; height: 18px;"></i></span>
                    <span>裝置列表</span>
                </a>
                <div class="nav-item active">
                    <span class="icon"><i data-lucide="film" style="width: 18px; height: 18px;"></i></span>
                    <span>錄影回放</span>
                </div>
                <a href="device-manage.html" class="nav-item">
                    <span class="icon"><i data-lucide="settings" style="width: 18px; height: 18px;"></i></span>
                    <span>系統設定</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button id="logoutBtn" class="nav-item" style="width: 100%; border: none; background: transparent;">
                    <span class="icon"><i data-lucide="log-out" style="width: 18px; height: 18px;"></i></span>
                    <span>登出</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="page-title">
                    <button id="widthSidebarBtn" class="hamburger-btn">
                        <i data-lucide="menu" style="width: 20px; height: 20px;"></i>
                    </button>
                    <h2>錄影回放</h2>
                </div>
            </header>

            <div class="content-area recordings-content">
                <!-- Video Player (Primary Focus - Takes Most Space) -->
                <div class="player-section" id="playerSection">
                    <div class="player-wrapper" id="playerWrapper">
                        <div class="player-placeholder" id="playerPlaceholder">
                            <div class="placeholder-content">
                                <div class="placeholder-icon">
                                    <i data-lucide="play-circle" style="width: 48px; height: 48px;"></i>
                                </div>
                                <p>點擊下方時間軸開始播放</p>
                            </div>
                        </div>
                        <video id="videoPlayer" controls playsinline></video>
                    </div>
                </div>

                <!-- Timeline Control Panel -->
                <div class="timeline-panel">
                    <!-- Compact Controls Row -->
                    <div class="timeline-controls">
                        <select id="deviceSelect" class="control-select">
                            <option value="">選擇裝置</option>
                        </select>
                        <div class="rec-source-buttons">
                            <button class="rec-source-btn active" data-src="cam" onclick="switchRecordingSource('cam')">
                                <i data-lucide="camera" style="width: 14px; height: 14px;"></i>
                                攝影機 1
                            </button>
                            <button class="rec-source-btn" data-src="cam2" onclick="switchRecordingSource('cam2')">
                                <i data-lucide="camera" style="width: 14px; height: 14px;"></i>
                                攝影機 2
                            </button>
                        </div>
                        <div class="date-nav">
                            <button id="prevDayBtn" class="nav-btn">
                                <i data-lucide="chevron-left" style="width: 16px; height: 16px;"></i>
                            </button>
                            <input type="date" id="timelineDate" class="date-picker">
                            <button id="nextDayBtn" class="nav-btn">
                                <i data-lucide="chevron-right" style="width: 16px; height: 16px;"></i>
                            </button>
                        </div>
                        <button id="todayBtn" class="today-btn">今天</button>
                        <button id="listToggleBtn" class="list-btn" title="檔案列表">
                            <i data-lucide="list" style="width: 18px; height: 18px;"></i>
                        </button>
                    </div>

                    <!-- Timeline Track -->
                    <div class="timeline-track-container">
                        <div class="timeline-hours" id="timelineHours"></div>
                        <div class="timeline-track" id="timelineTrack">
                            <div class="timeline-cursor" id="timelineCursor"></div>
                            <div class="timeline-hover-indicator" id="timelineHoverIndicator">
                                <span class="hover-time">--:--</span>
                            </div>
                        </div>
                        <div class="timeline-time-display">
                            <span id="timelineCurrentTime">--:--:--</span>
                        </div>
                    </div>
                </div>

                <!-- Slide-in File List Panel -->
                <div class="file-panel" id="filePanel">
                    <div class="file-panel-header">
                        <span>
                            <i data-lucide="folder-video" style="width: 16px; height: 16px; margin-right: 8px; vertical-align: middle;"></i>
                            錄影檔案
                        </span>
                        <button id="closePanelBtn" class="close-panel-btn">
                            <i data-lucide="x" style="width: 16px; height: 16px;"></i>
                        </button>
                    </div>
                    <div class="file-panel-content">
                        <div class="recordings-list" id="recordingsList">
                            <div class="empty-state">
                                <i data-lucide="video-off" style="width: 32px; height: 32px; margin-bottom: 12px; opacity: 0.5;"></i>
                                <p>請選擇裝置</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="file-panel-overlay" id="filePanelOverlay"></div>

                <!-- Hidden elements for JS compatibility -->
                <div style="display:none;">
                    <span id="playerTimeDisplay"></span>
                    <span id="playerStatus"></span>
                    <span id="timelineDateDisplay"></span>
                    <div id="statsPanel"></div>
                    <div id="playerInfoBar"></div>
                    <button id="playerCloseBtn"></button>
                    <button id="refreshRecordingsBtn"></button>
                    <button id="fullscreenBtn"></button>
                </div>
            </div>

            <!-- Sidebar Overlay -->
            <div id="sidebarOverlay" class="sidebar-overlay"></div>
        </main>
    </div>

    <script src="recordings.js"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>

</html>
