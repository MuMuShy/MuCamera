<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>錄影回放 - 水下監視系統</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- HLS.js for video playback -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">水</div>
                <h1>水下監視系統</h1>
            </div>

            <div class="user-profile">
                <div class="user-avatar">
                    <span id="username-initial">U</span>
                </div>
                <div class="user-details">
                    <div class="user-name" id="username">載入中...</div>
                    <div class="user-role">管理員</div>
                </div>
            </div>

            <nav class="nav-menu">
                <a href="index.html" class="nav-item">
                    <span class="icon">裝置列表</span>
                </a>
                <div class="nav-item active">
                    <span class="icon">錄影回放</span>
                </div>
                <div class="nav-item">
                    <span class="icon">系統設定</span>
                </div>
            </nav>

            <div class="sidebar-footer">
                <button id="logoutBtn" class="nav-item" style="width: 100%; border: none; background: transparent;">
                    <span>登出</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="page-title">
                    <h2>錄影回放</h2>
                </div>
                <div class="actions">
                    <button id="refreshRecordingsBtn" class="btn btn-secondary">
                        重新整理
                    </button>
                </div>
            </header>

            <div class="content-area recordings-content">
                <!-- Filters -->
                <div class="recordings-filters">
                    <div class="filter-group">
                        <label for="deviceSelect">選擇裝置</label>
                        <select id="deviceSelect" class="form-select">
                            <option value="">載入中...</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="timelineDate">日期</label>
                        <input type="date" id="timelineDate" class="form-input">
                    </div>
                    <div class="filter-group">
                        <button id="prevDayBtn" class="btn btn-secondary btn-sm">&lt; 前一天</button>
                        <button id="todayBtn" class="btn btn-secondary btn-sm">今天</button>
                        <button id="nextDayBtn" class="btn btn-secondary btn-sm">後一天 &gt;</button>
                    </div>
                </div>

                <!-- Stats Panel -->
                <div class="recordings-stats" id="statsPanel">
                    <!-- Stats will be loaded dynamically -->
                </div>

                <!-- Timeline -->
                <div class="timeline-container" id="timelineContainer">
                    <div class="timeline-header">
                        <span class="timeline-title">24 小時時間軸</span>
                        <span class="timeline-current-time" id="timelineCurrentTime">--:--:--</span>
                    </div>
                    <div class="timeline-wrapper">
                        <div class="timeline-hours">
                            <!-- 時間刻度 -->
                        </div>
                        <div class="timeline-track" id="timelineTrack">
                            <!-- 錄影區段會動態加入 -->
                            <div class="timeline-cursor" id="timelineCursor"></div>
                            <div class="timeline-hover-indicator" id="timelineHoverIndicator">
                                <span class="hover-time">--:--</span>
                            </div>
                        </div>
                    </div>
                    <div class="timeline-legend">
                        <span class="legend-item"><span class="legend-color has-recording"></span> 有錄影</span>
                        <span class="legend-item"><span class="legend-color no-recording"></span> 無錄影</span>
                    </div>
                </div>

                <!-- Video Player (inline) -->
                <div class="player-inline" id="playerInline" style="display: none;">
                    <div class="player-header-inline">
                        <span id="playerTimeDisplay">--:--:--</span>
                        <div class="player-controls-inline">
                            <button id="playerCloseBtn" class="btn btn-sm btn-secondary">關閉</button>
                        </div>
                    </div>
                    <video id="videoPlayer" controls playsinline></video>
                </div>

                <!-- Recordings List (collapsed by default when timeline is shown) -->
                <details class="recordings-list-details">
                    <summary>錄影列表（點擊展開）</summary>
                    <div class="recordings-list" id="recordingsList">
                        <div class="empty-state">請選擇一個裝置來查看錄影</div>
                    </div>
                </details>
            </div>

            <!-- Video Player Overlay -->
            <div id="playerOverlay" class="player-overlay">
                <div class="player-container">
                    <div class="player-header">
                        <span id="playerFilename">--</span>
                        <button id="closePlayerBtn" class="close-player-btn">&times;</button>
                    </div>
                    <video id="videoPlayer" controls playsinline></video>
                </div>
            </div>
        </main>
    </div>

    <script src="recordings.js"></script>
</body>

</html>
