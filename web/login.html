<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水下直播系統 - iHousing 水下影音科技</title>
    <meta name="description" content="iHousing 水下影音科技 - 水下即時監控暨錄影回放系統">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>

<body>
    <div class="container login-container">
        <div class="login-box">
            <div style="text-align: center; margin-bottom: 24px;">
                <div class="brand-icon" style="width: 64px; height: 64px; margin: 0 auto 16px; font-size: 1.5rem;">
                    <i data-lucide="waves" style="width: 32px; height: 32px;"></i>
                </div>
            </div>
            <h1>水下直播系統</h1>
            <p class="subtitle">iHousing 水下影音科技</p>

            <div class="tabs">
                <button class="tab-btn active" data-tab="login">
                    <i data-lucide="log-in" style="width: 16px; height: 16px; margin-right: 6px; vertical-align: middle;"></i>
                    登入
                </button>
                <button class="tab-btn" data-tab="register">
                    <i data-lucide="user-plus" style="width: 16px; height: 16px; margin-right: 6px; vertical-align: middle;"></i>
                    註冊
                </button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="loginUsername">
                        <i data-lucide="user" style="width: 14px; height: 14px; margin-right: 6px; vertical-align: middle;"></i>
                        使用者名稱
                    </label>
                    <input type="text" id="loginUsername" placeholder="輸入使用者名稱" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">
                        <i data-lucide="lock" style="width: 14px; height: 14px; margin-right: 6px; vertical-align: middle;"></i>
                        密碼
                    </label>
                    <input type="password" id="loginPassword" placeholder="輸入密碼" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <i data-lucide="arrow-right" style="width: 16px; height: 16px;"></i>
                    登入
                </button>
                <p id="loginError" class="error"></p>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form" style="display: none;">
                <div class="form-group">
                    <label for="registerUsername">
                        <i data-lucide="user" style="width: 14px; height: 14px; margin-right: 6px; vertical-align: middle;"></i>
                        使用者名稱
                    </label>
                    <input type="text" id="registerUsername" placeholder="選擇使用者名稱" required>
                </div>
                <div class="form-group">
                    <label for="registerEmail">
                        <i data-lucide="mail" style="width: 14px; height: 14px; margin-right: 6px; vertical-align: middle;"></i>
                        Email
                    </label>
                    <input type="email" id="registerEmail" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="registerPassword">
                        <i data-lucide="lock" style="width: 14px; height: 14px; margin-right: 6px; vertical-align: middle;"></i>
                        密碼
                    </label>
                    <input type="password" id="registerPassword" placeholder="建立密碼" required>
                </div>
                <div class="form-group">
                    <label for="registerPasswordConfirm">
                        <i data-lucide="shield-check" style="width: 14px; height: 14px; margin-right: 6px; vertical-align: middle;"></i>
                        確認密碼
                    </label>
                    <input type="password" id="registerPasswordConfirm" placeholder="再次輸入密碼" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <i data-lucide="user-plus" style="width: 16px; height: 16px;"></i>
                    建立帳號
                </button>
                <p id="registerError" class="error"></p>
            </form>
        </div>
        <div class="login-footer">
            &copy; 2025 iHousing 水下影音科技 版權所有
            <span class="version">v1.0.0</span>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        const API_BASE = window.location.origin;

        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
                document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
            });
        });

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');

            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'index.html';
                } else {
                    errorEl.textContent = data.detail || '登入失敗';
                }
            } catch (error) {
                errorEl.textContent = '網路錯誤，請重試。';
            }
        });

        // Register
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const passwordConfirm = document.getElementById('registerPasswordConfirm').value;
            const errorEl = document.getElementById('registerError');

            if (password !== passwordConfirm) {
                errorEl.textContent = '密碼不相符';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'index.html';
                } else {
                    errorEl.textContent = data.detail || '註冊失敗';
                }
            } catch (error) {
                errorEl.textContent = '網路錯誤，請重試。';
            }
        });

        // Check if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = 'index.html';
        }
    </script>
</body>

</html>
